[project]
name = "ncaa-baseball"
version = "0.1.0"
description = "NCAA baseball stats ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "duckdb>=1.5.3",
    "lxml>=6.1.1",
    "playwright>=1.60.0",
    "polars>=1.41.0",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[project.scripts]
ncaa-baseball = "ncaa_baseball.cli:app"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
